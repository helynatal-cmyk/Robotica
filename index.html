<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dinâmico de Luminosidade</title>
    <!-- Biblioteca MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* 1. O container principal (O "Quadro" do desenho) */
        .mapa-container {
            position: relative; /* Isso é o que permite os retângulos ficarem por cima */
            display: inline-block;
            margin: 0 auto;
            border: 4px solid #34495e;
            border-radius: 8px;
            overflow: hidden; /* Corta o que sobrar para fora */
        }

        /* 2. A Imagem de Fundo (Seu desenho) */
        .desenho-fundo {
            display: block;
            max-width: 800px; /* Ajuste para o tamanho do seu desenho */
            height: auto;
        }
        .figura-sensor {
            position: absolute;
            width: 100px;  /* Tamanho da sua figura */
            height: 80px;
            /* O Translate -50% garante que o centro da figura fique exatamente na coordenada escolhida */
            transform: translate(-50%, -50%);
            transition: all 0.5s ease; /* Transição suave de meio segundo */
            
            /* Começa "apagada" (opacidade baixa) e sem brilho */
            opacity: 3; 
            filter: drop-shadow(0 0 0px rgba(255, 255, 0, 0));
        }

        /* Posição de cada figura em cima do desenho */
        #fig1 { top: 63%; left: 20%; }
        #fig2 { top: 63%; left: 40%; }
        #fig3 { top: 63%; left: 61%; }
        #fig4 { top: 63%; left: 82%; }
       
    </style>
</head>
<body>

    <h2>Sistema de Estacionamento 2.0</h2>
    <p id="status">Conectando ao broker MQTT...</p>

    <div class="mapa-container">
        <!-- Substitua este link pela sua imagem! Pode ser um arquivo local ex: "meu_desenho.png" -->
        <img src="estacionamento.png" alt="Desenho Base" class="desenho-fundo">
        
        <!-- Os 4 retângulos que ficarão por cima -->
        <img src="carro.png" id="fig1" class="figura-sensor">
        <img src="carro.png" id="fig2" class="figura-sensor">
        <img src="carro.png" id="fig3" class="figura-sensor">
        <img src="carro.png" id="fig4" class="figura-sensor">
    </div>
<script>
        // Configurações do MQTT
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topico_mqtt = 'Barao_Ldr/sensores'; // O mesmo tópico do ESP32

        const client = mqtt.connect(brokerUrl);

        client.on('connect', function () {
            document.getElementById('status').innerText = '🟢 Conectado e aguardando dados...';
            document.getElementById('status').style.color = '#2ecc71';
            client.subscribe(topico_mqtt);
        });

       
        function atualizarFigura(id, porcentagem) {
            const figura = document.getElementById(id);
            
            if (porcentagem < 1000) {
                figura.style.opacity = 0; // Aparece
            } else {
                figura.style.opacity = 1; // Some
            }
        }

        client.on('message', function (topic, message) {
            try {
                const dados = JSON.parse(message.toString());

                // Aplica a regra para cada figura independentemente

               
                atualizarFigura('fig1', dados.Sensor1);
                atualizarFigura('fig2', dados.Sensor2);
                atualizarFigura('fig3', dados.Sensor3);
                atualizarFigura('fig4', dados.Sensor4);

            } catch (e) {
                console.error("Erro ao ler JSON:", e);
            }
        });
    </script>

   
</body>
</html>
